<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mừng lễ bế giảng IPClass</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            background: #000; overflow: hidden; 
            font-family: 'Segoe UI', Arial, sans-serif; color: white; 
        }
        
        canvas { 
            display: block; position: fixed; top: 0; left: 0; z-index: 1; 
            width: 100%; height: 100%; 
        }
        
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; text-align: center;
        }
        #overlay h2 { color: #ff4d94; margin-bottom: 10px; animation: pulse 1.5s infinite; font-size: 2rem; }
        #overlay p { color: #888; font-size: 1rem; }

        #ui-layer { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 10; width: 100%; pointer-events: none; }
        
        .text-animate { font-size: 5rem; font-weight: 900; color: #ff4d94; text-shadow: 0 0 30px #ff4d94; opacity: 0; display: none; }
        .active { display: block; animation: moveInOut 2s ease-in-out forwards; }
        
        @keyframes moveInOut {
            0% { opacity: 0; transform: scale(0.5); filter: blur(10px); }
            40% { opacity: 1; transform: scale(1.1); filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.3); filter: blur(5px); }
        }

        #wish-container { display: none; opacity: 0; }
        #first-wish { 
            width: 280px; height: 420px; margin: 0 auto;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 2px solid #ff4d94; padding: 25px; border-radius: 30px;
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px);
            box-shadow: 0 0 60px rgba(255, 77, 148, 0.4); font-size: 1.4rem;
            text-align: center;
        }

        #album-container { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; width: 340px; text-align: center; pointer-events: auto; }
        .album-card { background: rgba(20, 20, 20, 0.95); padding: 15px; border-radius: 20px; border: 1px solid #ff4d94; animation: fadeIn 0.6s forwards; }
        .album-card img { width: 100%; height: 380px; object-fit: cover; border-radius: 12px; }
        .btn-next { margin-top: 15px; background: #ff4d94; border: none; padding: 12px 30px; color: white; border-radius: 25px; cursor: pointer; font-weight: bold; }

        #photo-heart { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
        .heart-img { position: absolute; width: 80px; height: 80px; object-fit: cover; border-radius: 10px; border: 2px solid #fff; transform: translate(-50%, -50%) scale(0); transition: all 2s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>
</head>
<body>

<audio id="bg-music" src="NGƯỜI GIEO MẦM XANH - HỨA KIM TUYỀN x HOÀNG DŨNG (OFFICIAL MV).mp3" loop></audio>

<div id="overlay">
    <h2>Nhấn để bắt đầu món quà ❤️</h2>
</div>

<div id="ui-layer">
    <div id="text-box" class="text-animate"></div>
    <div id="wish-container">
        <div id="first-wish">
            <span style="font-size: 2.5rem;">🌸</span><br>
            <b style="color: #ff4d94; letter-spacing: 1px;">MỪNG LỄ BẾ GIẢNG IPCLASS</b><br>

            <span style="font-size: 1.1rem; color: #ffb3d1; font-style: italic;">
                "Cảm ơn các thầy đã truyền cảm hứng và kiến thức quý báu, giúp chúng em trưởng thành hơn mỗi ngày. Chúc các thầy luôn mạnh khỏe, hạnh phúc và nhiều tóc, tiếp tục dẫn dắt nhiều thế hệ học trò IPcon thành công ạ!"
            </span><br>
            <span style="font-size: 1.5rem; margin-top: 15px;">✨🎂✨</span>
        </div>
    </div>
</div>

<div id="album-container"><div id="album-content"></div></div>
<div id="photo-heart"></div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const bgMusic = document.getElementById('bg-music');
const wishContainer = document.getElementById('wish-container');
const albumContainer = document.getElementById('album-container');
const photoHeart = document.getElementById('photo-heart');

let particles = [];
let stars = [];
let mode = 'falling';

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

class Star {
    constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.size = Math.random() * 1.5;
        this.opacity = Math.random();
        this.speed = Math.random() * 0.015 + 0.005;
    }
    draw() {
        this.opacity += this.speed;
        if (this.opacity > 1 || this.opacity < 0) this.speed *= -1;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(this.opacity)})`;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    }
}

class Particle {
    constructor() { this.init(); }
    init() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.size = Math.random() * 2 + 1;
        this.speedY = Math.random() * 1.5 + 2;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.color = '#ff4d94';
    }
    update() {
        if (mode === 'falling') {
            this.y += this.speedY;
            if (this.y > window.innerHeight) this.y = -10;
        } else if (mode === 'heart') {
            this.x += (this.targetX - this.x) * 0.06;
            this.y += (this.targetY - this.y) * 0.06;
        } else if (mode === 'disperse') {
            this.x += this.vx; this.y += this.vy; this.size *= 0.97;
        }
    }
    draw() {
        if (this.size < 0.1) return;
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    }
}

const albumData = [
    { url: "https://sf-static.upanhlaylink.com/img/image_20260607c147df453d384a100f35671bf7671931.jpg", text: "cảm ơn người đưa đò thầm lặng"},
    { url: "https://sf-static.upanhlaylink.com/img/image_20260607c9ed92c9851c38ceda6251df71a3aec1.jpg", text: "dù bay xa, chúng em luôn khấc ghi công ơn"},
    { url: "https://sf-static.upanhlaylink.com/img/image_202606077f3b0131d28dbaf33c6097afcc5e0106.jpg", text: "Kính chúc thầy luôn giữ mãi nhiệt huyết với nghề"},
    { url: "https://sf-static.upanhlaylink.com/img/image_202606076d710cd234ff938e31e6699dd6e1a90d.jpg", text: "Kính chúc thầy nhiều niềm vui và thành công"},
    { url: "https://sf-static.upanhlaylink.com/img/image_2026060712a35fef75348f65286888c6b0eb367f.jpg", text: "Chúc thầy dồi dào sức khỏe, an khang"}
];

function getHeartPoint(t, scale) {
    let x = 16 * Math.pow(Math.sin(t), 3);
    let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    return { x: x * scale + window.innerWidth/2, y: y * scale + window.innerHeight/2 };
}

async function playText(str) {
    const textBox = document.getElementById('text-box');
    textBox.innerText = str; textBox.classList.remove('active');
    void textBox.offsetWidth; textBox.classList.add('active');
    await new Promise(r => setTimeout(r, 2200));
}

function showAlbum() {
    return new Promise(resolve => {
        albumContainer.style.display = 'block';
        let currentIndex = 0;
        function renderCard() {
            const data = albumData[currentIndex];
            document.getElementById('album-content').innerHTML = `
                <div class="album-card">
                    <div style="color:#ffb3d1; font-style:italic; margin-bottom:12px; font-size:1.1rem;">${data.text}</div>
                    <img src="${data.url}">
                    <button class="btn-next">${currentIndex === 4 ? 'Hoàn tất' : 'Ảnh tiếp theo'}</button>
                </div>`;
            document.querySelector('.btn-next').onclick = () => {
                currentIndex++;
                if (currentIndex < 5) renderCard();
                else {
                    albumContainer.style.animation = 'fadeOut 0.8s forwards';
                    setTimeout(() => { albumContainer.style.display = 'none'; resolve(); }, 800);
                }
            };
        }
        renderCard();
    });
}

async function run() {
    for (let item of ["3", "2", "1", "MỪNG", "LỄ", "BẾ", "GIẢNG", "IPCLASS"]) await playText(item);

    mode = 'heart';
    particles.forEach(p => {
        let t = Math.random() * Math.PI * 2; let r = Math.sqrt(Math.random());
        let pos = getHeartPoint(t, 15 * r);
        p.targetX = pos.x; p.targetY = pos.y;
    });
    await new Promise(r => setTimeout(r, 3000));
    mode = 'disperse'; 

    wishContainer.style.display = 'block';
    wishContainer.style.animation = 'fadeIn 1.5s forwards';
    await new Promise(r => setTimeout(r, 10000));
    wishContainer.style.animation = 'fadeOut 1.5s forwards';
    setTimeout(() => wishContainer.style.display = 'none', 1500);

    await showAlbum();

    photoHeart.style.display = 'block';
    const totalFinal = 24;
    for (let i = 0; i < totalFinal; i++) {
        const img = document.createElement('img');
        img.src = albumData[i % 5].url;
        img.className = 'heart-img';
        photoHeart.appendChild(img);
        let t = (i / totalFinal) * Math.PI * 2;
        let pos = getHeartPoint(t, 21);
        setTimeout(() => {
            img.style.opacity = '1'; img.style.left = pos.x + 'px'; img.style.top = pos.y + 'px';
            img.style.transform = `translate(-50%, -50%) scale(1) rotate(${Math.random()*20-10}deg)`;
        }, i * 120);
    }
}

function animate() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => s.draw());
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
}

overlay.addEventListener('click', () => {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
    
    bgMusic.play().catch(e => console.log("Music error", e));

    setTimeout(() => {
        resizeCanvas();
        overlay.style.display = 'none';
        stars = []; for (let i = 0; i < 500; i++) stars.push(new Star());
        particles = []; for (let i = 0; i < 2000; i++) particles.push(new Particle());
        run();
    }, 300);
});

window.addEventListener('resize', resizeCanvas);
animate();
</script>
</body>
</html>
